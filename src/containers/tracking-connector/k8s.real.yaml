# Tracking Connector 部署清单（CCE）
# 应用方式：kubectl apply -f k8s.yaml
# 说明：Service 以 NodePort 暴露（端口 30080），供私有 ELB 后端成员（节点 IP）转发；
#       容器端口 8080，健康检查 /health。
apiVersion: v1
kind: ConfigMap
metadata:
  name: tracking-connector-config
  namespace: default
data:
  KAFKA_BOOTSTRAP_SERVERS: "10.0.2.73,10.0.2.195,10.0.2.40"
  KAFKA_BOOTSTRAP_SERVERS_SSL: "10.0.2.73:9093,10.0.2.195:9093,10.0.2.40:9093"   # DMS Kafka connect_address
  KAFKA_TOPIC: "vehicle-tracking-events"
  KAFKA_USERNAME: "vehicle-tracking"
  KAFKA_PASSWORD: "UD3P@gmi2lyGY*JU%@8a"
  CACHE_ENDPOINT: "redis-5ce91309-b5d0-423e-bfe0-67eac66abcaf.cn-north-4.dcs.myhuaweicloud.com"                   # DCS Redis 连接域名
  CACHE_PORT: "6379"
  POLICY_COLLECTION: "policy_rules"
  SECURITY_COLLECTION: "security_rules"
  MONGO_CONNECTION: "mongodb://rwuser:do2AbEkqWjzfdgqph6f*@10.0.2.216:8635,10.0.2.224:8635,10.0.2.12:8635/admin?replicaSet=replica&authSource=admin"                  # GeminiDB Mongo 连接串
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-connector
  namespace: default
  labels:
    app: tracking-connector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tracking-connector
  template:
    metadata:
      labels:
        app: tracking-connector
    spec:
      imagePullSecrets:
        - name: swr-cred
      containers:
        - name: tracking-connector
          image: "swr.cn-north-4.myhuaweicloud.com/vehicle-tracking/tracking-connector:latest"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: tracking-connector-config
          resources:
            requests:
              cpu: "0.25"
              memory: "256Mi"
            limits:
              cpu: "0.25"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: tracking-connector-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: tracking-connector
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
