# Tracking Connector 部署清单（CCE）
# 应用方式：kubectl apply -f k8s.yaml
# 说明：Service 以 NodePort 暴露（端口 30080），供私有 ELB 后端成员（节点 IP）转发；
#       容器端口 8080，健康检查 /health。
apiVersion: v1
kind: ConfigMap
metadata:
  name: tracking-connector-config
  namespace: default
data:
  KAFKA_BOOTSTRAP_SERVERS: "{{KAFKA_BOOTSTRAP_SERVERS}}"   # DMS Kafka connect_address
  KAFKA_TOPIC: "vehicle-tracking-events"
  CACHE_ENDPOINT: "{{REDIS_DOMAIN_NAME}}"                   # DCS Redis 连接域名
  CACHE_PORT: "6379"
  POLICY_COLLECTION: "policy_rules"
  SECURITY_COLLECTION: "security_rules"
  MONGO_CONNECTION: "{{MONGO_CONNECTION}}"                  # GeminiDB Mongo 连接串
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-connector
  namespace: default
  labels:
    app: tracking-connector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tracking-connector
  template:
    metadata:
      labels:
        app: tracking-connector
    spec:
      containers:
        - name: tracking-connector
          image: "{{SWR_ADDR}}/{{SWR_ORG}}/tracking-connector:latest"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: tracking-connector-config
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: tracking-connector-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: tracking-connector
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
