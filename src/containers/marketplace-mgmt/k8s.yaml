# Marketplace 订阅管理部署清单（CCE）
# 应用方式：kubectl apply -f k8s.yaml
# 说明：Service 以 NodePort 暴露（端口 30081），供私有 ELB 后端成员转发。
apiVersion: v1
kind: ConfigMap
metadata:
  name: marketplace-mgmt-config
  namespace: default
data:
  KAFKA_BOOTSTRAP_SERVERS: "{{KAFKA_BOOTSTRAP_SERVERS}}"
  POLICY_COLLECTION: "policy_rules"
  MONGO_CONNECTION: "{{MONGO_CONNECTION}}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace-mgmt
  namespace: default
  labels:
    app: marketplace-mgmt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marketplace-mgmt
  template:
    metadata:
      labels:
        app: marketplace-mgmt
    spec:
      containers:
        - name: marketplace-mgmt
          image: "{{SWR_ADDR}}/{{SWR_ORG}}/marketplace-mgmt:latest"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: marketplace-mgmt-config
          resources:
            requests:
              cpu: "0.5"
              memory: "1Gi"
            limits:
              cpu: "0.5"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: marketplace-mgmt-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: marketplace-mgmt
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
